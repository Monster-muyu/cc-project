<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>多机规划 · VRAM 显存计算工具</title>
  <link rel="stylesheet" href="/static/style.css?v=24"/>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <h1>显存计算工具</h1>
      <span class="sub">多机部署规划</span>
    </div>
    <nav class="tabs">
      <a href="/">单机估算</a>
      <a href="/plan" class="on">多机规划</a>
      <a href="/vllm-manual">vLLM 参数</a>
    </nav>
    <div class="actions"></div>
  </div>
</header>

<main>
  <section class="card panel-left">
    <h2>🖥 服务器清单</h2>
    <div id="srv-list"></div>
    <div id="srv-warn" class="warnline" hidden></div>
    <button id="btn-add-srv" style="width:100%">＋ 添加服务器</button>
    <p class="hint">勾选参与规划的服务器入库保存，下次直接选；host 仅用于生成启动命令</p>

    <h2 style="margin-top:18px">🎯 规划目标</h2>
    <label>推理引擎 <select id="p-engine">
      <option value="vllm">vLLM</option>
      <option value="sglang">SGLang</option>
    </select></label>
    <p class="hint">多机只支持 vLLM/SGLang；Ollama 与 llama.cpp 为单机引擎，请用「单机估算」页</p>
    <div class="row" style="align-items:flex-end">
      <label style="flex:1">模型 <select id="p-model"></select></label>
      <button id="btn-fetch-model" title="从 HuggingFace/ModelScope 按 Repo ID 拉取并入库">＋ 拉取</button>
    </div>
    <div class="row">
      <label>上下文 <input id="p-ctx" type="text" placeholder="252k"/></label>
      <label>并发 <input id="p-conc" type="number" value="1" min="1"/></label>
    </div>
    <div class="row">
      <label>量化 <select id="p-quant">
        <option value="fp16">fp16</option><option value="bf16">bf16</option>
        <option value="fp8">fp8</option><option value="int8">int8</option>
        <option value="int4">int4</option><option value="gguf-q4_k_m">gguf-q4_k_m</option>
      </select></label>
      <label>KV 量化 <select id="p-kvquant">
        <option value="fp16">fp16</option><option value="fp8">fp8</option>
        <option value="int8">int8</option>
      </select></label>
    </div>
    <label>显存利用率 <span id="p-util-val">90%</span>
      <input id="p-util" type="range" min="0.5" max="0.95" step="0.05" value="0.9"/>
    </label>
    <p class="hint" style="margin-top:12px">勾选服务器或修改任意参数会自动规划</p>
  </section>

  <section class="panel-right">
    <div id="plan-warnings"></div>
    <div id="plans"></div>
    <p class="hint" id="plan-empty">左侧勾选服务器后自动给出候选部署方案</p>
  </section>
</main>

<footer>
  数据：模型参数量来自 HuggingFace <code>safetensors</code> 元数据（零权重下载）· 估算含启发式成分，以实测为准 ·
  <a href="http://192.168.243.204/root/vram-calc" target="_blank">GitLab 仓库</a>
</footer>

<!-- 添加/编辑服务器 -->
<div id="modal-srv" class="modal hidden">
  <div class="modal-box">
    <h3 id="sf-title">添加服务器</h3>
    <label>名称 <input id="sf-name" placeholder="server-a"/></label>
    <label>host（可选，仅用于生成启动命令） <input id="sf-host" placeholder="192.168.1.11"/></label>
    <label>GPU 配置（选型号 + 填卡数；同种 GPU 可加多行；混插会标记且不参与规划）</label>
    <div id="sf-rows"></div>
    <button id="sf-add-row">＋ 加一种 GPU</button>
    <div id="sf-error" class="error"></div>
    <div class="modal-actions">
      <button id="sf-cancel">取消</button>
      <button id="sf-save" class="primary">保存</button>
    </div>
  </div>
</div>

<!-- 拉取模型入库 -->
<div id="modal-mf2" class="modal hidden">
  <div class="modal-box">
    <h3>拉取模型入库</h3>
    <label>来源 <select id="mf2-source">
      <option value="hf">HuggingFace</option>
      <option value="ms">ModelScope(魔搭)</option>
    </select></label>
    <label>Repo ID <input id="mf2-repo" placeholder="Qwen/Qwen3.8-27B"/></label>
    <div id="mf2-res" class="error"></div>
    <div class="modal-actions">
      <button id="mf2-cancel">取消</button>
      <button id="mf2-go" class="primary">拉取并入库</button>
    </div>
  </div>
</div>

<script src="/static/common.js?v=1"></script>
<script src="/static/plan.js?v=2"></script>
<script src="/static/assistant.js?v=2"></script>
</body>
</html>
